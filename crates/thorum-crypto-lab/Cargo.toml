[package]
name = "thorum-crypto-lab"
description = "Isolated primitive integration and measurement for Thorum research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ml-kem = { version = "=0.3.3", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
sha3 = { version = "=0.12.0", default-features = false }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
zeroize = { version = "=1.9.1", features = ["alloc"] }

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.145"
