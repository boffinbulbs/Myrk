name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        suite: [development, adversarial]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fmt --all -- --check
      - name: Check signature ownership producer formatting
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fmt --manifest-path research/signature-ownership/producer/Cargo.toml -- --check
      - name: Check native signature formatting
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fmt --manifest-path research/signature-native/Cargo.toml -- --check
      - name: Check complete native signature formatting
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fmt --manifest-path research/signature-complete-native/Cargo.toml -- --check
      - name: Fetch locked dependencies
        run: rustup run 1.94.1 cargo fetch --locked
      - name: Fetch native signature dependencies
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fetch --manifest-path research/signature-native/Cargo.toml --locked
      - name: Fetch complete native signature dependencies
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fetch --manifest-path research/signature-complete-native/Cargo.toml --locked
      - name: Run tests
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo test --workspace --locked --offline -- --test-threads=1
      - name: Run adversarial proof tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-proof-lab --release --locked --offline -- --test-threads=1
      - name: Run adversarial note proof tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-note-proof-lab --release --locked --offline -- --test-threads=1
      - name: Run adversarial hidden membership tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-membership-proof-lab --release --locked --offline -- --test-threads=1
      - name: Run adversarial stable nullifier tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-nullifier-proof-lab --release --locked --offline -- --test-threads=1
      - name: Run adversarial hash and XOF tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-hash-proof-lab --release --locked --offline -- --test-threads=1
      - name: Run adversarial modular arithmetic tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-arithmetic-proof-lab --release --locked --offline -- --test-threads=1
      - name: Run adversarial polynomial transform tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-ntt-proof-lab --release --locked --offline -- --test-threads=1
      - name: Run adversarial private owner binding tests
        if: matrix.suite == 'adversarial'
        run: rustup run 1.94.1 cargo test -p thorum-owner-binding-proof-lab --release --locked --offline -- --test-threads=1
      - name: Check synthetic authorization signatures
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo run -p thorum-crypto-lab --example signature_reference_fixture --locked --offline -- --check
      - name: Check exact transaction signature ownership fixtures
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo run --manifest-path research/signature-ownership/producer/Cargo.toml --release --locked --offline --target-dir target/signature-ownership -- --verify-only research/signature-ownership/raw-fixture.json
      - name: Check signature ownership producer lints
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo clippy --manifest-path research/signature-ownership/producer/Cargo.toml --release --all-targets --locked --offline --target-dir target/signature-ownership -- -D warnings
      - name: Compile native signature experiments
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo test --manifest-path research/signature-native/Cargo.toml --release --lib --no-run --locked --offline --target-dir target/signature-native
      - name: Check native signature lints
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo clippy --manifest-path research/signature-native/Cargo.toml --release --all-targets --locked --offline --target-dir target/signature-native -- -D warnings
      - name: Compile complete native signature experiments
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo test --manifest-path research/signature-complete-native/Cargo.toml --release --lib --no-run --locked --offline --jobs 1 --target-dir target/signature-complete-native
      - name: Check complete native signature lints
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo clippy --manifest-path research/signature-complete-native/Cargo.toml --release --all-targets --locked --offline --target-dir target/signature-complete-native -- -D warnings
      - name: Check storage matrix formatting
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fmt --manifest-path research/storage-matrix/Cargo.toml -- --check
      - name: Test checked storage matrix
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo test --manifest-path research/storage-matrix/Cargo.toml --locked --offline --jobs 1 --target-dir target/storage-matrix -- --test-threads=1
      - name: Check storage matrix lints
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo clippy --manifest-path research/storage-matrix/Cargo.toml --all-targets --locked --offline --target-dir target/storage-matrix -- -D warnings
      - name: Check storage commitment formatting
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo fmt --manifest-path research/storage-commitments/Cargo.toml -- --check
      - name: Test storage commitments
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo test --manifest-path research/storage-commitments/Cargo.toml --locked --offline --jobs 1 --target-dir target/storage-commitments -- --test-threads=1
      - name: Check storage commitment lints
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo clippy --manifest-path research/storage-commitments/Cargo.toml --all-targets --locked --offline --target-dir target/storage-commitments -- -D warnings
      - name: Check lints
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Build documentation
        if: matrix.suite == 'development'
        run: rustup run 1.94.1 cargo doc --workspace --no-deps --locked --offline
      - name: Check dependency inventory
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/crypto/dependency_inventory.py --check
      - name: Check native signature records
        if: runner.os == 'Linux' && matrix.suite == 'development'
        run: python3 research/signature-native/static_check.py
      - name: Check complete native signature records
        if: runner.os == 'Linux' && matrix.suite == 'development'
        run: python3 research/signature-complete-native/static_check.py
      - name: Check complete native signature figures
        if: runner.os == 'Linux' && matrix.suite == 'development'
        run: python3 research/signature-complete-native/generate_figure.py --check
      - name: Check proof feature profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/proofs/profile_check.py
      - name: Check note proof feature profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/note-proofs/profile_check.py
      - name: Check membership proof feature profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/membership-proofs/profile_check.py
      - name: Check nullifier proof feature profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/nullifier-proofs/profile_check.py
      - name: Check hash proof feature profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/hash-proofs/profile_check.py
      - name: Check arithmetic proof feature profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/arithmetic-proofs/profile_check.py
      - name: Check transform proof feature profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/ntt-proofs/profile_check.py
      - name: Check private owner binding profile
        if: runner.os == 'Linux' && matrix.suite == 'development'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: python3 research/owner-bindings/profile_check.py

  row:
    name: Conditional row (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check required row proof inventory
        run: python research/reconstructed-row/check_test_inventory.py
      - name: Verify conditional row proof
        run: cargo test -p thorum-hash-proof-lab --release --lib --locked --offline reconstructed_row::proof::tests::one_honest_private_reconstructed_row_proof -- --exact --ignored --nocapture --test-threads=1
      - name: Verify fresh row proofs and transport rejection
        run: cargo test -p thorum-hash-proof-lab --release --lib --locked --offline reconstructed_row::proof::tests::corpus_tests::three_fresh_private_rows_public_mutations_and_transport -- --exact --ignored --nocapture --test-threads=1
      - name: Reject raw false row proofs
        run: cargo test -p thorum-hash-proof-lab --release --lib --locked --offline reconstructed_row::proof::tests::corpus_tests::sixteen_raw_false_row_proofs_reject_backend_and_wrapper -- --exact --ignored --nocapture --test-threads=1
      - name: Verify row API and separate profiles
        run: cargo test -p thorum-hash-proof-lab --release --test reconstructed_row --locked --offline conditional_row_external_api_and_separate_profiles -- --exact --ignored --nocapture --test-threads=1

  research:
    name: Reference model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run reference tests
        run: python3 -m unittest discover -s research/emission -p 'test_*.py' -v
      - name: Check storage commitment references
        run: python3 research/storage-commitments/reference.py --check
      - name: Reject malformed storage reference inputs
        run: python3 -m unittest discover -s research/storage-commitments -p test_reference.py -v
      - name: Check cryptographic measurement summary
        run: python3 research/crypto/plot_results.py --summary-only --check
      - name: Check relation encoding vectors
        run: python3 research/relations/reference_vectors.py --check
      - name: Check recipient capability vectors
        run: python3 research/relations/recipient_vectors.py --check
      - name: Check proof reference vectors
        run: python3 research/proofs/reference_vectors.py --check
      - name: Check proof measurement summary
        run: python3 research/proofs/plot_results.py --summary-only --check
      - name: Check note commitment reference vectors
        run: python3 research/note-proofs/reference_vectors.py --check
      - name: Check private membership reference vectors
        run: python3 research/membership-proofs/reference_vectors.py --check
      - name: Check stable nullifier reference vectors
        run: python3 research/nullifier-proofs/reference_vectors.py --check
      - name: Check authorization hash reference vectors
        run: python3 research/hash-proofs/reference_vectors.py --check
      - name: Check authorization arithmetic reference vectors
        run: python3 research/arithmetic-proofs/reference_vectors.py --check
      - name: Check authorization transform reference vectors
        run: python3 research/ntt-proofs/reference_vectors.py --check
      - name: Check private owner binding reference vectors
        run: python3 research/owner-bindings/reference_vectors.py --check
      - name: Check complete signature verification references
        run: python3 research/signatures/reference_vectors.py --check
      - name: Check signature ownership source inventory
        run: python3 research/signature-ownership/static_check.py
      - name: Check exact transaction signature ownership references
        run: python3 research/signature-ownership/reference_vectors.py --input research/signature-ownership/raw-fixture.json --output research/signature-ownership/reference-fixture.json --check
      - name: Check coefficient rounding reference vectors
        run: python3 research/coefficient-constraints/reference_vectors.py --check
      - name: Check coefficient packing reference vectors
        run: python3 research/coefficient-constraints/packing_vectors.py --check
      - name: Check coefficient constraint profile
        run: python3 research/coefficient-constraints/profile_check.py
      - name: Check compact transform reference vectors
        run: python3 research/compact-ntt/reference_vectors.py --check
      - name: Check compact transform profile
        run: python3 research/compact-ntt/profile_check.py
      - name: Check connected matrix sampling references
        run: python3 research/matrix-sampling/reference_vectors.py --check
      - name: Check connected matrix sampling profile
        run: python3 research/matrix-sampling/profile_check.py
      - name: Check connected sparse challenge references
        run: python3 research/challenge-sampling/reference_vectors.py --check
      - name: Check connected sparse challenge profile
        run: python3 research/challenge-sampling/profile_check.py
      - name: Check same signature challenge references
        run: python3 research/signature-challenge/reference_vectors.py --check
      - name: Check same signature challenge profile
        run: python3 research/signature-challenge/profile_check.py
      - name: Check private key source references
        run: python3 research/key-source/reference_vectors.py --check
      - name: Check private key source profile
        run: python3 research/key-source/profile_check.py --check
      - name: Check conditional row references
        run: python3 research/reconstructed-row/reference_vectors.py --check
      - name: Check conditional row profile
        run: python3 research/reconstructed-row/profile_check.py --check
      - name: Check protocol architecture figures
        run: python3 research/protocol-figures/generate_figures.py --check
      - name: Check private authorization figures
        run: python3 research/authorization-figures/generate_figures.py --check
      - name: Check accounting and authority figures
        run: python3 research/accounting-figures/generate_figures.py --check
      - name: Check Aegis design figures
        run: python3 research/aegis/generate_figures.py --check
      - name: Check transparent research chart variants
        run: python3 research/presentation/render_figures.py --check
      - name: Check private Safe design figure
        run: python3 research/safe-design/generate_figures.py --check

  stored_proof:
    name: Stored proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Check stored proof formatting
        run: rustup run 1.94.1 cargo fmt --manifest-path research/storage-pcs/Cargo.toml --all -- --check
      - name: Fetch stored proof dependencies
        run: rustup run 1.94.1 cargo fetch --manifest-path research/storage-pcs/Cargo.toml --locked
      - name: Check independent quartic reference
        run: python research/storage-pcs/reference.py --check
      - name: Check domain views and actual constraint degree
        run: rustup run 1.94.1 cargo test --manifest-path research/storage-pcs/Cargo.toml --locked --offline --release --test integration -- --test-threads=1
      - name: Check complete proof compatibility and false trace rejection
        run: rustup run 1.94.1 cargo test --manifest-path research/storage-pcs/Cargo.toml --locked --offline --release --test integration -- --ignored --test-threads=1
      - name: Check adapted backend lints
        run: rustup run 1.94.1 cargo clippy --manifest-path research/storage-pcs/Cargo.toml --locked --offline -p kova-storage-fri --lib -- -D warnings -A clippy::nonminimal_bool
      - name: Check stored proof harness lints
        run: rustup run 1.94.1 cargo clippy --manifest-path research/storage-pcs/Cargo.toml --locked --offline -p kova-storage-pcs-experiment --test integration -- -D warnings -A clippy::nonminimal_bool
