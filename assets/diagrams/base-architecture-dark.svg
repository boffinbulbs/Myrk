<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1040" viewBox="0 0 1560 1040" role="img" aria-labelledby="figure-title figure-description" data-theme="dark" data-canvas="transparent">
  <title id="figure-title">Myrk base protocol architecture</title>
  <desc id="figure-description">Planned base runtime. Protocol architecture and development order, not performance measurements</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#80b4ff" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="58" font-size="31" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="60" y="58">Myrk base protocol architecture</tspan>
    </text>
    <text x="60" y="94" font-size="20" font-weight="400" fill="#b3c3d8" text-anchor="start">
      <tspan x="60" y="94">Planned runtime with private payment and confidential stake integration gates.</tspan>
    </text>
    <rect x="60" y="165" width="430" height="205" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="82" y="200" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="200">Private wallet</tspan>
    </text>
    <text x="82" y="240" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="240">Local keys and note recovery</tspan>
      <tspan x="82" y="269">Private proof construction</tspan>
      <tspan x="82" y="298">Encrypted note delivery</tspan>
      <tspan x="82" y="327">Scoped wallet services</tspan>
    </text>
    <rect x="565" y="165" width="430" height="205" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="587" y="200" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="200">Private proof integration</tspan>
    </text>
    <text x="587" y="240" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="240">Membership and stable nullifiers</tspan>
      <tspan x="587" y="269">Same witness ownership and signature</tspan>
      <tspan x="587" y="298">Value conservation and delivery binding</tspan>
      <tspan x="587" y="327">Payment and confidential stake gates</tspan>
    </text>
    <rect x="1070" y="165" width="430" height="205" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="1092" y="200" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="200">Node kernel</tspan>
    </text>
    <text x="1092" y="240" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="240">Proof admission and spent state</tspan>
      <tspan x="1092" y="269">Commitment roots and resource limits</tspan>
      <tspan x="1092" y="298">Maturity and ledger transitions</tspan>
      <tspan x="1092" y="327">Public chain and ciphertext RPC</tspan>
    </text>
    <polyline points="490,265 565,265" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <polyline points="995,265 1070,265" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="60" y="455" width="1440" height="140" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="88" y="493" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="88" y="493">Executable research labs</tspan>
    </text>
    <text x="88" y="532" font-size="21" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="88" y="532">Accounting, note relations, source constraints, arithmetic and bounded proof profiles.</tspan>
      <tspan x="88" y="564">Component evidence feeds complete authorization integration.</tspan>
    </text>
    <polyline points="780,455 780,370" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="805" y="417" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="805" y="417">Integration</tspan>
    </text>
    <rect x="1070" y="705" width="430" height="205" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="1092" y="740" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="740">One PoW chain</tspan>
    </text>
    <text x="1092" y="780" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="780">Equihash work and block ordering</tspan>
      <tspan x="1092" y="809">Merged mining integration</tspan>
      <tspan x="1092" y="838">Block validation and reward maturity</tspan>
      <tspan x="1092" y="867">Work selection rules</tspan>
    </text>
    <rect x="565" y="705" width="430" height="205" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="587" y="740" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="740">Stake checkpoints</tspan>
    </text>
    <text x="587" y="780" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="780">Stake weighted checkpoint votes</tspan>
      <tspan x="587" y="809">Certificate validation and finality</tspan>
      <tspan x="587" y="838">Confidential stake participation</tspan>
      <tspan x="587" y="867">Onward spending after finality</tspan>
    </text>
    <rect x="60" y="705" width="430" height="205" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="82" y="740" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="740">Independent validator</tspan>
    </text>
    <text x="82" y="780" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="780">Verifies private proofs and chain rules</tspan>
      <tspan x="82" y="809">Checks work and certificates</tspan>
      <tspan x="82" y="838">Maintains spent state and note roots</tspan>
      <tspan x="82" y="867">Serves public chain data</tspan>
    </text>
    <polyline points="1285,370 1530,370 1530,655 1285,655 1285,705" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <polyline points="1070,808 995,808" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <polyline points="565,808 490,808" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="60" y="1005" font-size="19" font-weight="400" fill="#b3c3d8" text-anchor="start">
      <tspan x="60" y="1005">Base protocol architecture. Runtime integration pending.</tspan>
    </text>
  </g>
</svg>
