<rect class="box" x="24" y="26" width="912" height="218" rx="8"/>
<text x="48" y="54">Fixed quartic computation / owned attempt</text>
<rect class="box" x="48" y="92" width="190" height="104" rx="4"/><text x="143" y="123" text-anchor="middle">C / Owned input</text><text class="small" x="143" y="150" text-anchor="middle">256 by 2 raw fields</text><text class="small" x="143" y="174" text-anchor="middle">Private owner and leases</text>
<path class="line" d="M238 144H280" marker-end="url(#a)"/>
