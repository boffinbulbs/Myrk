<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Owned computation proof connection</title><desc id="desc">C holds the owned main input. Z derives the fixed relation quotient and commits main, quotient and auxiliary data. One batched opening constructs the original proof. Y verifies the public proof separately.</desc>
