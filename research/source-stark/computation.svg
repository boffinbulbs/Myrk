<path class="line" d="M564 144H606" marker-end="url(#a)"/>
<rect class="box" x="614" y="92" width="298" height="104" rx="4"/><text x="763" y="123" text-anchor="middle">One batched opening</text><text class="small" x="763" y="150" text-anchor="middle">Actual returned complete proof</text><text class="small" x="763" y="174" text-anchor="middle">Then ProofProduced closes private reads</text>
<path class="line" d="M763 196V266" marker-end="url(#a)"/>
<rect class="box" x="614" y="274" width="298" height="48" rx="4"/><text x="763" y="304" text-anchor="middle">Y / Retained full verifier</text>
<text class="small" x="48" y="291">The proof is constructed before its validity is decided.</text><text class="small" x="48" y="316">Synthetic research class. Separate private payment integration.</text>
