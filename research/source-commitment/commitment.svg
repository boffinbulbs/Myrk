<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">Owned source commitment construction</title>
  <desc id="desc">Checked raw inputs are masked and expanded through retained kernels. The actual hiding MMCS creates a root and private prover data. One outer guard spans the operation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#526951"/></marker></defs>
  <style>text{font-family:Georgia,serif;fill:#182219;text-anchor:middle}rect,path{stroke:#526951;stroke-width:1.4;fill:none}.label{font-size:17px}.small{font-size:14px}@media(prefers-color-scheme:dark){text{fill:#dfe8da}rect,path{stroke:#9db49a}}</style>
  <rect x="24" y="48" width="190" height="76"/><text class="label" x="119" y="78">Checked owned input</text><text class="small" x="119" y="103">Raw header and owner</text>
  <path d="M214 86H251" marker-end="url(#arrow)"/>
  <rect x="257" y="48" width="220" height="76"/><text class="label" x="367" y="78">Retained preparation</text><text class="small" x="367" y="103">Actual masks and tiled LDE</text>
  <path d="M477 86H515" marker-end="url(#arrow)"/>
  <rect x="521" y="48" width="202" height="76"/><text class="label" x="622" y="78">Hiding Merkle MMCS</text><text class="small" x="622" y="103">Actual salts and hash tree</text>
  <path d="M723 86H743V50H761" marker-end="url(#arrow)"/>
  <path d="M743 86V124H761" marker-end="url(#arrow)"/>
  <rect x="767" y="25" width="209" height="50"/><text class="label" x="871" y="56">Commitment root</text>
  <rect x="767" y="99" width="209" height="50"/><text class="label" x="871" y="130">Private prover data</text>
  <path d="M119 124V192H871V149"/>
  <text class="label" x="500" y="225">One guarded attempt through the actual returned tuple</text>
  <text class="small" x="500" y="256">Root construction is complete for this finite class. Opening proofs have a separate gate.</text>
</svg>
