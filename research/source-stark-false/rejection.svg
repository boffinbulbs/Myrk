<title id="title">Canonical invalid witness verification</title><desc id="desc">C changes one canonical field. Z is the unchanged owned prover and returns a complete proof. Y is the retained verifier, which verifies the commitment openings and then rejects the violated AIR identity. An existing honest proof is accepted separately.</desc>
