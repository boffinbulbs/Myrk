<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Shared owned and dense preparation</title>
  <desc id="desc">Dense input and an owned checked raw file feed one preparation kernel. The owner counts raw and prepared artifacts. Failed attempts retain reservations and cannot be reused.</desc>
  <style>
    svg { color: #24392b; font-family: Georgia, serif; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .line { fill: none; stroke: currentColor; stroke-width: 1.3; marker-end: url(#tip); }
    text { fill: currentColor; font-size: 15px; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) { svg { color: #dce8dd; } }
  </style>
  <defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="currentColor"/></marker></defs>
  <g text-anchor="middle">
    <rect class="box" x="20" y="35" width="195" height="55"/>
    <text x="117" y="59">Dense input</text><text class="small" x="117" y="78">Ordinary trait dispatch</text>
    <rect class="box" x="20" y="120" width="195" height="55"/>
    <text x="117" y="144">Owned raw file</text><text class="small" x="117" y="163">Checked exact windows</text>
    <rect class="box" x="310" y="78" width="265" height="85"/>
    <text x="442" y="106">One preparation kernel</text>
    <text class="small" x="442" y="127">W originals, then W + 2r samples</text>
    <text class="small" x="442" y="146">Continuing RNG, bounded windows</text>
    <rect class="box" x="670" y="90" width="285" height="65"/>
    <text x="812" y="116">Prepared checked matrix</text>
    <text class="small" x="812" y="138">2H rows, W + r columns</text>
    <path class="line" d="M215 62H260V120H308M215 147H260V120M575 120H668"/>
    <path class="line" d="M442 163V218H565"/>
    <text x="700" y="223">Failed attempt stays closed</text>
    <text class="small" x="490" y="278">Raw and prepared files share one owner ledger. Cleanup preserves failed reservations.</text>
  </g>
</svg>
