<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000" role="img" aria-labelledby="figure-title figure-description" data-theme="dark" data-canvas="transparent">
  <title id="figure-title">Work ordering and stake checkpoint roles</title>
  <desc id="figure-description">Planned base consensus. Protocol architecture and development order, not performance measurements</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#80b4ff" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="58" font-size="31" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="60" y="58">Work ordering and stake checkpoint roles</tspan>
    </text>
    <text x="60" y="94" font-size="20" font-weight="400" fill="#b3c3d8" text-anchor="start">
      <tspan x="60" y="94">Planned base consensus separates block work from certificate finality.</tspan>
    </text>
    <rect x="60" y="165" width="430" height="205" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="82" y="200" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="200">PoW miners</tspan>
    </text>
    <text x="82" y="240" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="240">Construct candidate blocks</tspan>
      <tspan x="82" y="269">Solve compatible Equihash work</tspan>
      <tspan x="82" y="298">Submit blocks for full validation</tspan>
      <tspan x="82" y="327">Earn the mining reward allocation</tspan>
    </text>
    <rect x="565" y="165" width="430" height="205" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="587" y="200" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="200">Ordered work chain</tspan>
    </text>
    <text x="587" y="240" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="240">Validate blocks and ledger rules</tspan>
      <tspan x="587" y="269">Apply the work selection rule</tspan>
      <tspan x="587" y="298">Track reorganizations before finality</tspan>
      <tspan x="587" y="327">Define checkpoint opportunities</tspan>
    </text>
    <rect x="1070" y="165" width="430" height="205" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="1092" y="200" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="200">Stakers</tspan>
    </text>
    <text x="1092" y="240" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="240">Validate the candidate checkpoint</tspan>
      <tspan x="1092" y="269">Vote under stake eligibility rules</tspan>
      <tspan x="1092" y="298">Enforce conflicting vote rules</tspan>
      <tspan x="1092" y="327">Assemble a finality certificate</tspan>
    </text>
    <polyline points="490,267 565,267" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <polyline points="995,267 1070,267" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="1070" y="495" width="430" height="205" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="1092" y="530" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="530">Certificate verification</tspan>
    </text>
    <text x="1092" y="570" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="570">Authenticate the stake certificate</tspan>
      <tspan x="1092" y="599">Check threshold and target state</tspan>
      <tspan x="1092" y="628">Enforce finality and recovery rules</tspan>
      <tspan x="1092" y="657">Certificate validity establishes finality</tspan>
    </text>
    <rect x="565" y="495" width="430" height="205" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="587" y="530" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="530">Finalized private state</tspan>
    </text>
    <text x="587" y="570" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="570">Protect finalized ledger transitions</tspan>
      <tspan x="587" y="599">Preserve note and spent right state</tspan>
      <tspan x="587" y="628">Expose the finalized checkpoint</tspan>
      <tspan x="587" y="657">Retain private proof requirements</tspan>
    </text>
    <rect x="60" y="495" width="430" height="205" rx="10" fill="#16372d" stroke="#42546b" stroke-width="1.5" />
    <text x="82" y="530" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="530">Wallet onward spending</tspan>
    </text>
    <text x="82" y="570" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="570">Recover locally owned notes</tspan>
      <tspan x="82" y="599">Verify inclusion and finality</tspan>
      <tspan x="82" y="628">Spend finalized ordinary payments</tspan>
      <tspan x="82" y="657">Apply separate reward maturity rules</tspan>
    </text>
    <polyline points="1285,370 1285,495" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <polyline points="1070,597 995,597" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <polyline points="565,597 490,597" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="60" y="800" width="1440" height="110" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="88" y="840" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="88" y="840">Independent regular validators</tspan>
    </text>
    <text x="88" y="877" font-size="21" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="88" y="877">Verify complete private proofs, PoW blocks, stake certificates and ledger transitions.</tspan>
    </text>
    <text x="60" y="965" font-size="19" font-weight="400" fill="#b3c3d8" text-anchor="start">
      <tspan x="60" y="965">Base consensus design. Runtime integration pending.</tspan>
    </text>
  </g>
</svg>
