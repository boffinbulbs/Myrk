<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1010" viewBox="0 0 1560 1010" role="img" aria-labelledby="figure-title figure-description" data-theme="dark" data-canvas="transparent">
  <title id="figure-title">Private wallet Safe policy lifecycle</title>
  <desc id="figure-description">Later contract and wallet policy. Protocol architecture and development order, not performance measurements</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#80b4ff" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="58" font-size="31" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="60" y="58">Private wallet Safe policy lifecycle</tspan>
    </text>
    <text x="60" y="94" font-size="20" font-weight="400" fill="#b3c3d8" text-anchor="start">
      <tspan x="60" y="94">Later contract and wallet policy. Chain rules enforce the protection.</tspan>
    </text>
    <rect x="60" y="175" width="430" height="180" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="82" y="210" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="210">Protected balance</tspan>
    </text>
    <text x="82" y="250" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="250">Private notes under the Safe policy</tspan>
      <tspan x="82" y="279">Withdrawal and recovery authorities</tspan>
      <tspan x="82" y="308">Predetermined protected destination</tspan>
    </text>
    <rect x="565" y="175" width="430" height="180" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="587" y="210" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="210">Withdrawal request</tspan>
    </text>
    <text x="587" y="250" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="250">Authorize a pending withdrawal</tspan>
      <tspan x="587" y="279">Fix the withdrawal destination</tspan>
      <tspan x="587" y="308">Start the configured policy delay</tspan>
    </text>
    <rect x="1070" y="175" width="430" height="180" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="1092" y="210" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="210">Pending withdrawal</tspan>
    </text>
    <text x="1092" y="250" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="250">Retain one pending spending right</tspan>
      <tspan x="1092" y="279">Enforce the release condition</tspan>
      <tspan x="1092" y="308">Allow the restricted recovery path</tspan>
    </text>
    <polyline points="490,265 565,265" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <polyline points="995,265 1070,265" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="565" y="555" width="430" height="180" rx="10" fill="#16372d" stroke="#42546b" stroke-width="1.5" />
    <text x="587" y="590" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="590">Recovery cancellation</tspan>
    </text>
    <text x="587" y="630" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="587" y="630">Separate recovery authorization</tspan>
      <tspan x="587" y="659">Return to the protected destination</tspan>
      <tspan x="587" y="688">Consume the pending right once</tspan>
    </text>
    <rect x="1070" y="555" width="430" height="180" rx="10" fill="#172231" stroke="#42546b" stroke-width="1.5" />
    <text x="1092" y="590" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="590">Withdrawal release</tspan>
    </text>
    <text x="1092" y="630" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="1092" y="630">Original withdrawal authorization</tspan>
      <tspan x="1092" y="659">Release condition satisfied</tspan>
      <tspan x="1092" y="688">Consume the pending right once</tspan>
    </text>
    <rect x="60" y="555" width="430" height="180" rx="10" fill="#16372d" stroke="#42546b" stroke-width="1.5" />
    <text x="82" y="590" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="590">Protected destination</tspan>
    </text>
    <text x="82" y="630" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="82" y="630">Receive the cancelled funds</tspan>
      <tspan x="82" y="659">Retain the selected protection policy</tspan>
      <tspan x="82" y="688">Recovery authority has a fixed target</tspan>
    </text>
    <polyline points="1285,355 1285,435 780,435 780,555" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="930" y="414" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="930" y="414">Recovery before unlock</tspan>
    </text>
    <polyline points="1285,435 1285,555" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="1310" y="500" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="1310" y="500">Delay satisfied</tspan>
    </text>
    <polyline points="565,645 490,645" fill="none" stroke="#80b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="60" y="835" width="1440" height="90" rx="10" fill="#172e4b" stroke="#42546b" stroke-width="1.5" />
    <text x="88" y="871" font-size="23" font-weight="700" fill="#e2e8f0" text-anchor="start">
      <tspan x="88" y="871">Chain enforced policy</tspan>
    </text>
    <text x="88" y="904" font-size="21" font-weight="400" fill="#e2e8f0" text-anchor="start">
      <tspan x="88" y="904">Authorization, delay, fixed recovery destination and exactly one consumption.</tspan>
    </text>
    <text x="60" y="975" font-size="19" font-weight="400" fill="#b3c3d8" text-anchor="start">
      <tspan x="60" y="975">Later contract and wallet policy.</tspan>
    </text>
  </g>
</svg>
