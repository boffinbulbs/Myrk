<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 364" role="img" aria-labelledby="title description">
  <title id="title">Private signature and ownership constraints</title>
  <desc id="description">Logical constraint dependencies. Proof and ledger integration have a separate gate. The diagram is not an execution schedule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b7a78" />
    </marker>
  </defs>
  <text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203040" font-weight="600">Private signature and ownership constraints</text>
  <rect x="40" y="72" width="208" height="98" rx="10" fill="none" stroke="#0b7a78" stroke-width="1.8" />
  <text x="144" y="99" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">Source binding</text>
  <text x="144" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#203040" text-anchor="middle">Witness key, signature, note</text>
  <text x="144" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#586274" text-anchor="middle">Public A(T), 196 fields</text>
  <path d="M 248 120 H 282" stroke="#0b7a78" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="284" y="72" width="208" height="98" rx="10" fill="none" stroke="#0b7a78" stroke-width="1.8" />
  <text x="388" y="99" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">Forward transforms</text>
  <text x="388" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#203040" text-anchor="middle">Seven z, one c, eight t1</text>
  <text x="388" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#586274" text-anchor="middle">Scaled t1 uses 8192</text>
  <path d="M 492 120 H 526" stroke="#0b7a78" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="528" y="72" width="208" height="98" rx="10" fill="none" stroke="#0b7a78" stroke-width="1.8" />
  <text x="632" y="99" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">Matrix arithmetic</text>
  <text x="632" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#203040" text-anchor="middle">56 bounded matrix streams</text>
  <text x="632" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#586274" text-anchor="middle">Eight corrected rows</text>
  <path d="M 736 120 H 770" stroke="#0b7a78" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="772" y="72" width="208" height="98" rx="10" fill="none" stroke="#0b7a78" stroke-width="1.8" />
  <text x="876" y="99" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">Inverse and hints</text>
  <text x="876" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#203040" text-anchor="middle">Eight normalized inverses</text>
  <text x="876" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#586274" text-anchor="middle">1024 packed w1 bytes</text>
  <path d="M 980 120 H 1014" stroke="#0b7a78" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="1016" y="72" width="208" height="98" rx="10" fill="none" stroke="#0b7a78" stroke-width="1.8" />
  <text x="1120" y="99" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">Challenge equality</text>
  <text x="1120" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#203040" text-anchor="middle">SHAKE256(mu || w1)</text>
  <text x="1120" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#586274" text-anchor="middle">All 64 seed bytes equal</text>
  <path d="M 1120 170 V 241" stroke="#0b7a78" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="40" y="244" width="1184" height="70" rx="10" fill="none" stroke="#586274" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="632" y="271" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">Hiding proof and ledger integration</text>
  <text x="632" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#586274" text-anchor="middle">Separate implementation and security gates</text>
  <text x="40" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#586274">Public input A(T). Note commitment and signature intermediates remain witness values.</text>
</svg>
