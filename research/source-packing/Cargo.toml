[package]
name = "kova-source-packing"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "MIT"
autotests = false

[lib]
test = false
doctest = false

[dependencies]
p3-air = { version = "=0.8.0", default-features = false }
p3-baby-bear = { version = "=0.8.0", default-features = false }
p3-field = { version = "=0.8.0", default-features = false }
p3-matrix = { version = "=0.8.0", default-features = false }

[workspace]

[dev-dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = "=1.0.145"

[[test]]
name = "mechanism"
path = "tests/mechanism.rs"

[profile.release]
overflow-checks = true
incremental = false
