<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Private packed source read ports</title>
<desc id="desc">One held private word supplies repeated byte reads selected by an anchored clock. Boolean decomposition binds every consumer and zero padding.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#687d70"/></marker></defs>
<g fill="none" stroke="#82978a" stroke-width="1.3"><rect x="24" y="44" width="258" height="114" rx="4"/><rect x="366" y="44" width="268" height="114" rx="4"/><rect x="718" y="44" width="258" height="114" rx="4"/><path d="M282 101H350" marker-end="url(#arrow)"/><path d="M634 101H702" marker-end="url(#arrow)"/><path d="M153 158V220H319M681 220H847V158"/><rect x="319" y="202" width="362" height="36" rx="3"/></g>
<g fill="#294638" font-family="Arial, sans-serif" text-anchor="middle"><g font-size="16"><text x="153" y="73">C / Held private sources</text><text x="500" y="73">Z / Fixed clock read ports</text><text x="847" y="73">Y / Bound consumer bytes</text></g><g font-size="14"><text x="153" y="103">60 words held across all rows</text><text x="153" y="131">w = b₀ + 256b₁ + 65536b₂</text><text x="500" y="103">24 Boolean bits per selected word</text><text x="500" y="131">Every byte uses the same source</text><text x="847" y="103">Unaligned and repeated reads</text><text x="847" y="131">Tail padding and inactive zeros</text><text x="500" y="226">A repeated read cannot choose a new private word</text></g><text x="500" y="288" font-size="13">Selected byte mechanism. Full signature and payment integration remain separate.</text></g>
</svg>
