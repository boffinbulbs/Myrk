[package]
name = "kova-signature-proof-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
autotests = false
license = "MIT"
repository = "https://github.com/th0rigin/Kova"

[lib]
test = false
doctest = false

[[test]]
name = "contract"
path = "tests/contract.rs"

[dependencies]
kova-signature-packed = { path = "../signature-packed", default-features = false }
kova-proof-preflight = { path = "../proof-preflight" }
thorum-relation-lab = { path = "../../crates/thorum-relation-lab" }
p3-air = { version = "=0.8.0", default-features = false }
p3-baby-bear = { version = "=0.8.0", default-features = false }
p3-commit = { version = "=0.8.0", default-features = false }
p3-dft = { version = "=0.8.0", default-features = false }
p3-field = { version = "=0.8.0", default-features = false }
p3-uni-stark = { version = "=0.8.0", default-features = false }
rand = { version = "=0.10.3", default-features = false, features = ["std_rng"] }

[dev-dependencies]
p3-matrix = { version = "=0.8.0", default-features = false }
p3-merkle-tree = { version = "=0.8.0", default-features = false }
p3-symmetric = { version = "=0.8.0", default-features = false }
sha3 = { version = "=0.12.0", default-features = false }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
thorum-core = { path = "../../crates/thorum-core" }
thorum-crypto-lab = { path = "../../crates/thorum-crypto-lab" }

[workspace]

[profile.release]
overflow-checks = true
incremental = false
