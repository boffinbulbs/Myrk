<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Global schedule and arithmetic lifetime boundaries</title>
<desc id="desc">The four Keccak slots execute across all 8192 rows. Forward transforms overlap matrix work. NTT product and inverse hint phases have disjoint active schedules, while dormant constraints remain obligations.</desc>
<g fill="#c0d3b9" font-family="Georgia,serif"><text x="32" y="35" font-size="22">One clock. Explicit lifetime boundaries.</text></g>
<g fill="#9eafa4" font-family="Arial,sans-serif" font-size="12"><text x="32" y="61">Source schedule metadata. Active arithmetic phases are subsets of the construction intervals.</text></g>
