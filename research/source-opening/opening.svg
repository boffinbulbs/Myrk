<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Three source opening paths with retained verification</title>
  <desc id="desc">Retained dense, owned source and dense convenience paths bind their actual root before sampling points. Equal opening proofs are checked by the retained verifier.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#526951"/></marker></defs>
  <style>text{font-family:Georgia,serif;fill:#182219;text-anchor:middle}rect,path{stroke:#526951;stroke-width:1.4;fill:none}.label{font-size:16px}.small{font-size:14px}@media(prefers-color-scheme:dark){text{fill:#dfe8da}rect,path{stroke:#9db49a}}</style>
  <rect x="24" y="24" width="205" height="52"/><text class="label" x="126" y="56">C / Retained dense</text>
  <rect x="24" y="100" width="205" height="52"/><text class="label" x="126" y="132">Z / Owned source</text>
  <rect x="24" y="176" width="205" height="52"/><text class="label" x="126" y="208">Y / Dense convenience</text>
  <path d="M229 50H251V202H229M251 126H273" marker-end="url(#arrow)"/>
  <rect x="279" y="88" width="222" height="76"/><text class="label" x="390" y="118">Observe actual root</text><text class="small" x="390" y="144">Then sample two points</text>
  <path d="M501 126H544" marker-end="url(#arrow)"/>
  <rect x="550" y="88" width="197" height="76"/><text class="label" x="648" y="118">Equal opening proofs</text><text class="small" x="648" y="144">Nine actual FRI rounds</text>
  <path d="M747 126H789" marker-end="url(#arrow)"/>
  <rect x="795" y="88" width="181" height="76"/><text class="label" x="885" y="118">Retained verifier</text><text class="small" x="885" y="144">Three proofs accepted</text>
  <text class="label" x="500" y="269">Changed root, claim and authentication digest are rejected</text>
  <text class="small" x="500" y="298">A consumed clone of private prover data refuses another opening.</text>
</svg>
