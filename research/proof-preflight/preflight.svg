<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Prospective resource planning</title>
  <desc id="desc">Typed shape and fixed class checks precede the actual masking check and trusted AIR introspection. A plan retains unresolved security and integration obligations.</desc>
  <style>
    svg { color: #24392b; font-family: Georgia, serif; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .line { fill: none; stroke: currentColor; stroke-width: 1.3; marker-end: url(#tip); }
    text { fill: currentColor; font-size: 14px; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) { svg { color: #dce8dd; } }
  </style>
  <defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="currentColor"/></marker></defs>
  <g text-anchor="middle">
    <rect class="box" x="15" y="55" width="170" height="62"/>
    <text x="100" y="81">Typed request</text><text class="small" x="100" y="101">Version and dimensions</text>
    <rect class="box" x="215" y="55" width="170" height="62"/>
    <text x="300" y="81">Fixed resource class</text><text class="small" x="300" y="101">Cheap refusal first</text>
    <rect class="box" x="415" y="55" width="170" height="62"/>
    <text x="500" y="81">Actual masking check</text><text class="small" x="500" y="101">Per matrix, one opening</text>
    <rect class="box" x="615" y="55" width="170" height="62"/>
    <text x="700" y="81">Retained AIR helpers</text><text class="small" x="700" y="101">Trusted source only</text>
    <rect class="box" x="815" y="55" width="170" height="62"/>
    <text x="900" y="81">Prospective plan</text><text class="small" x="900" y="101">No storage reservation</text>
    <path class="line" d="M185 86H213M385 86H413M585 86H613M785 86H813"/>
    <path class="line" d="M300 117V160H410"/>
    <text x="500" y="165">Typed refusal</text>
    <text class="small" x="500" y="213">Resource accounting is separate from proof validity, privacy and ledger acceptance.</text>
  </g>
</svg>
