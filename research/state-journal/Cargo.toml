[package]
name = "kova-state-journal"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
publish = false
autotests = false
autobins = false
autobenches = false

[features]
default = []
diagnostics = []

[lib]
test = false
doctest = false

[[bin]]
name = "journal-worker"
path = "src/worker.rs"
test = false
required-features = ["diagnostics"]

[[test]]
name = "admission"
path = "tests/admission.rs"
required-features = ["diagnostics"]

[workspace]

[profile.release]
overflow-checks = true
incremental = false
