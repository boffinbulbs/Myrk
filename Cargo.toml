[workspace]
members = [
    "crates/thorum-core",
    "crates/thorum-crypto-lab",
    "crates/thorum-relation-lab",
    "crates/thorum-proof-lab",
    "crates/thorum-note-proof-lab",
    "crates/thorum-membership-proof-lab",
    "crates/thorum-nullifier-proof-lab",
    "crates/thorum-hash-proof-lab",
    "crates/thorum-arithmetic-proof-lab",
    "crates/thorum-ntt-proof-lab",
    "crates/thorum-owner-binding-proof-lab",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MIT"
repository = "https://github.com/boffinbulbs/Myrk"

[profile.release]
overflow-checks = true
lto = "thin"

[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
